spring:
  application:
    name: facturapro-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/facturapro?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Guayaquil&characterEncoding=UTF-8}
    username: ${DB_USER:facturapro}
    password: ${DB_PASSWORD:facturapro_dev_2026}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: America/Guayaquil
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_SECURE:false}

server:
  port: ${SERVER_PORT:8085}
  error:
    include-stacktrace: never
    include-message: never
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    initial-username: ${APP_ADMIN_INITIAL_USERNAME:admin}
    initial-password: ${APP_ADMIN_INITIAL_PASSWORD:}
    initial-full-name: ${APP_ADMIN_INITIAL_FULL_NAME:Administrador}
    initial-email: ${APP_ADMIN_INITIAL_EMAIL:}
  demo:
    enabled: ${APP_DEMO_DATA_ENABLED:false}
  login:
    max-failed-attempts: 5
    lock-minutes: 15
  password:
    reset-ttl-minutes: 60
    min-length: 8
  mail:
    dev-logging-enabled: ${APP_MAIL_DEV_LOGGING:false}

logging:
  level:
    root: INFO
    com.facturapro: INFO
    org.hibernate.SQL: WARN
